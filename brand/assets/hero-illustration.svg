<svg width="1000" height="420" viewBox="0 0 1000 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Agent intent flows through the ChainSage verdict core to execution">
  <defs>
    <linearGradient id="flow" x1="0" y1="210" x2="1000" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C5CFF"/><stop offset="0.5" stop-color="#9C82FF"/><stop offset="1" stop-color="#5B8DEF"/>
    </linearGradient>
    <linearGradient id="core" x1="430" y1="120" x2="570" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B9A5FF"/><stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#7C5CFF" stop-opacity="0.5"/><stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- connecting flow -->
  <path d="M150 210 H400" stroke="url(#flow)" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
  <path d="M600 210 H850" stroke="url(#flow)" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
  <!-- AGENT node (left) -->
  <circle cx="110" cy="210" r="46" fill="#0E0A1E" stroke="url(#flow)" stroke-width="3"/>
  <text x="110" y="206" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" fill="#A6A6B5">AGENT</text>
  <text x="110" y="226" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6E6E80">intent</text>
  <!-- VERDICT CORE (center diamond) -->
  <circle cx="500" cy="210" r="120" fill="url(#glow)"/>
  <rect x="430" y="140" width="140" height="140" rx="26" transform="rotate(45 500 210)" fill="url(#core)"/>
  <rect x="462" y="172" width="76" height="76" rx="14" transform="rotate(45 500 210)" fill="#0B0B12" opacity="0.55"/>
  <text x="500" y="204" text-anchor="middle" font-family="'Hanken Grotesk', sans-serif" font-weight="800" font-size="20" fill="#F4F4F7">ChainSage</text>
  <text x="500" y="228" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#B9A5FF">VERDICT</text>
  <!-- EXECUTION node (right) -->
  <circle cx="890" cy="210" r="46" fill="url(#flow)"/>
  <text x="890" y="206" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#0E0A1E" font-weight="700">EXECUTE</text>
  <text x="890" y="226" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#0E0A1E">on-chain</text>
  <!-- verdict pills -->
  <g font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">
    <rect x="612" y="96" width="74" height="26" rx="13" fill="#34D399" opacity="0.16" stroke="#34D399"/>
    <text x="649" y="114" text-anchor="middle" fill="#34D399">ALLOW</text>
    <rect x="612" y="298" width="84" height="26" rx="13" fill="#FBBF24" opacity="0.16" stroke="#FBBF24"/>
    <text x="654" y="316" text-anchor="middle" fill="#FBBF24">REVIEW</text>
    <rect x="320" y="298" width="64" height="26" rx="13" fill="#F4534F" opacity="0.16" stroke="#F4534F"/>
    <text x="352" y="316" text-anchor="middle" fill="#F4534F">DENY</text>
  </g>
</svg>
